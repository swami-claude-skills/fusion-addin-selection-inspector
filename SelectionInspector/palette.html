/* ============================ sorting ============================ */
function sortBy(key){
  if(sortKey === key){
    if(sortDir === 1){ sortDir = -1; }
    else { sortKey = null; sortDir = 1; }   // third click restores natural order
  } else { sortKey = key; sortDir = 1; }
  paintSortIndicators();
  render();
}

/* ============================ column resizing ============================ */
let rz = null;
function startResize(e, i){
  e.preventDefault(); e.stopPropagation();
  rz = {i:i, x:e.clientX, w:widths[i]};
  document.body.classList.add('resizing');
  window.addEventListener('mousemove', onResize);
  window.addEventListener('mouseup', endResize);
}
function onResize(e){
  if(!rz) return;
  setWidth(rz.i, rz.w + (e.clientX - rz.x));
}
function endResize(){
  rz = null;
  document.body.classList.remove('resizing');
  window.removeEventListener('mousemove', onResize);
  window.removeEventListener('mouseup', endResize);
  saveWidths();
}

/* fit-to-widest: measure the real text with the real fonts, take the max.
   Canvas is the fast path; an offscreen span is the fallback if 2d context
   is unavailable, so "Fit columns" can never throw. */
let ctx = null;
try{ ctx = document.createElement('canvas').getContext('2d'); }catch(e){ ctx = null; }
let mspan = null;

function fontOf(el){
  const s = getComputedStyle(el);
  return (s.fontStyle||'normal')+' '+(s.fontWeight||'400')+' '+s.fontSize+' '+s.fontFamily;
}
function measureText(font, text){
  if(ctx){ ctx.font = font; return ctx.measureText(text).width; }
  if(!mspan){
    mspan = document.createElement('span');
    mspan.style.cssText = 'position:absolute;left:-9999px;top:-9999px;visibility:hidden;white-space:pre;';
    document.body.appendChild(mspan);
  }
  mspan.style.font = font;
  mspan.textContent = text;
  return mspan.offsetWidth || (String(text).length * 6.5);
}
/* What a cell spends on things that are not the text: padding, and in the name
   column the caret, the indent of a nested row and any "3 of 248" chip. Fit
   ignored all of it, so fitting the Entity Name column left every name still
   truncated by roughly a caret and an indent - which read as "fit doesn't
   work". Row kinds differ, so take the worst of the three on show. */
function cellOverhead(i){
  const kinds = ['tbody tr:not(.sub):not(.grp):not(.spacer)',
                 'tbody tr.sub', 'tbody tr.grp'];
  let worst = 0, sawOne = false;
  for(const sel of kinds){
    const tr = tbodyEl.querySelector(sel);
    if(!tr) continue;
    const td = tr.children[i];
    if(!td) continue;
    const txt = td.querySelector('.txt');
    let over;
    if(txt){
      over = td.clientWidth - availFor(txt);
    } else {
      const cs = getComputedStyle(td);
      over = parseFloat(cs.paddingLeft || 0) + parseFloat(cs.paddingRight || 0);
    }
    if(isFinite(over)){ sawOne = true; if(over > worst) worst = over; }
  }
  return sawOne ? worst : 22;
}

/* The text a cell would show if it had room - not what it is showing, which is
   already truncated, and not the raw field, which for Path includes the entity
   segment the column no longer prints. */
function fitTextFor(c, r){
  if(c.key === 'path') return shortPath(parentPath(r.path));
  const v = r[c.key];
  return String(v == null ? '' : v);
}

/* Canvas measureText knows about the font and nothing else. It does not apply
   `text-transform`, and it does not add `letter-spacing` - and the Type column
   is a pill with both (`uppercase`, `.08em`), as is every column header. So fit
   measured a string nobody was rendering, came back short, and the column it
   had just "fitted" stayed truncated. This reads the style and corrects for it. */
function textMetrics(el){
  const cs = getComputedStyle(el);
  const spacing = parseFloat(cs.letterSpacing);
  return {
    font: (cs.fontStyle||'normal')+' '+(cs.fontWeight||'400')+' '+cs.fontSize+' '+cs.fontFamily,
    transform: cs.textTransform,
    spacing: isFinite(spacing) ? spacing : 0,
    // the element's own horizontal box, which for a pill is padding + border
    box: (parseFloat(cs.paddingLeft)||0) + (parseFloat(cs.paddingRight)||0) +
         (parseFloat(cs.borderLeftWidth)||0) + (parseFloat(cs.borderRightWidth)||0)
  };
}

function renderedWidth(text, m){
  let t = String(text == null ? '' : text);
  if(m.transform === 'uppercase') t = t.toUpperCase();
  else if(m.transform === 'lowercase') t = t.toLowerCase();
  else if(m.transform === 'capitalize') t = t.replace(/\b\w/g, c => c.toUpperCase());
  return measureText(m.font, t) + m.spacing * t.length;
}

function fitColumn(i){
  const c = COLS[i];
  if(c.fit === false){ setWidth(i, c.def); saveWidths(); return; }

  const th = hrow.children[i];
  const hm = textMetrics(th.querySelector('.lbl') || th);
  let widest = renderedWidth(c.label, hm) + 26;   // header text, arrow, FIT marker

  const sampleCell = tbodyEl.querySelector('tr:not(.spacer) td:nth-child('+(i+1)+')');
  if(sampleCell){
    const src = sampleCell.querySelector('.tag') || sampleCell.querySelector('.txt') || sampleCell;
    const m = textMetrics(src);
    const inner = (src === sampleCell) ? 0 : m.box;   // the pill's own padding and border
    const over = cellOverhead(i);
    for(let k=0; k<view.length; k++){
      const w = renderedWidth(fitTextFor(c, view[k]), m) + inner + over + 2;
      if(w > widest) widest = w;
    }
  }
  setWidth(i, Math.ceil(widest));

  /* Then widen until nothing in the column is cut off, checking with the same
     function that lights the marker. Fit's job is defined as "the marker goes
     out", so the two cannot end up disagreeing - which is what produced
     "fitted 257->329px" followed by "still too narrow" followed by "already
     fits". A bounded loop, because a column whose minimum exceeds the pane
     could otherwise grow forever. */
  for(let pass = 0; pass < 8; pass++){
    const short = columnShortfall(i);
    if(short <= 0) break;
    const before = widths[i];
    setWidth(i, before + short + 2);
    if(widths[i] === before) break;      // clamped: growing further is futile
  }
  saveWidths();
  return widths[i];
}

/* Fitting one column - the FIT marker in a header, or a double-click on a
   divider - said nothing either. Two clicks with no change and no message is
   indistinguishable from a dead button. */
function fitOne(i, why){
  const before = widths[i];
  const after = fitColumn(i);
  const label = COLS[i].label;
  // whether it worked is a question about the column, not about the arithmetic
  const stillCut = columnShortfall(i) > 0;
  const detail = (before === after ? 'already ' + after + 'px' : before + '\u2192' + after + 'px');
  logLine('Fit: "' + label + '" ' + (why || '') + ' — ' + detail +
          (stillCut ? ' — still cut off' : ''), stillCut ? 'warn' : 'ok');
  showFitBar(
    stillCut
      ? '"' + label + '" is at ' + after + 'px and still cannot show everything — ' +
        'the pane is not wide enough for it.'
      : (before === after
          ? '"' + label + '" already fits its content — nothing to change.'
          : 'Fitted "' + label + '" — ' + before + '\u2192' + after + 'px.'),
    stillCut ? undefined : 'done');
}

/* The worst overflow among the cells currently rendered in one column, in
   pixels. Zero when everything fits. */
/* How much wider one column needs to be, measured against what is on screen.

   `scrollWidth > clientWidth` alone is not enough. The Entity Name cell is a
   flex row - caret, text, and sometimes a "1 of 4 selected" chip - and a flex
   item shrinks rather than overflowing, so a truncated name reports no overflow
   at all. That is why fitting the column twice changed nothing while the FIT
   marker stayed lit: the row that did not fit was a *group* row, whose label
   and chip are not in `view` and so were never measured.

   So for the columns that carry a .txt span, the question asked is squeeze's
   question - does the full string fit the space the span actually has - which
   covers entity rows, group rows and their chips alike. */
/* One question, one answer, used by both the FIT marker and by Fit itself.

   They used to answer it separately - the marker from squeeze's record of what
   it had shortened, Fit from its own per-row arithmetic - and they disagreed:
   the log would read "Fit: Entity Name 257->329px", then "Entity Name is too
   narrow", then "Fit: already fits". Two measurements, one column, opposite
   conclusions, and a marker that would not go out. Whatever the discrepancy
   was, the fix is not to find it; it is to stop having two of them.

   Returns how much wider the column needs to be. Zero means nothing in it is
   cut off, which is exactly when the marker should not be lit. */
function columnShortfall(i){
  let worst = 0;
  const trs = tbodyEl.children;
  const fonts = {};
  for(let r = 0; r < trs.length; r++){
    if(trs[r].classList.contains('spacer')) continue;
    const td = trs[r].children[i];
    if(!td) continue;
    // Before the table has been laid out every width is zero, and "the text is
    // wider than nothing" is true of all text. Nothing can be judged yet.
    if(!td.clientWidth) continue;

    const span = td.querySelector('.txt[data-col]');
    if(span){
      const col = span.dataset.col || 'name';
      if(!fonts[col]) fonts[col] = textMetrics(span);
      const full = (col === 'path')
        ? shortPath(span.parentNode.getAttribute('title') || '')
        : (span.dataset.full || span.textContent);
      const need = renderedWidth(full, fonts[col]) - availFor(span);
      if(need > worst) worst = need;
      continue;
    }

    const el = td.querySelector('.tag') || td;
    const gap = el.scrollWidth - el.clientWidth;
    if(gap > worst) worst = gap;
    if(el !== td){
      const cs = getComputedStyle(td);
      const room = td.clientWidth -
        ((parseFloat(cs.paddingLeft)||0) + (parseFloat(cs.paddingRight)||0));
      const need = el.offsetWidth - room;
      if(need > worst) worst = need;
    }
  }
  return Math.ceil(worst);
}
/* Fit had no visible outcome. If it computed widths close to the current ones
   the table did not move, and with the log hidden by default there was nothing
   at all to distinguish "did nothing" from "did nothing it needed to" - which
   reads as broken either way. So it reports: what changed, or that nothing had
   to. Errors are caught per column, because one column that cannot be measured
   should not abandon the other six silently. */
function fitAll(){
  const before = widths.slice();
  const trouble = [];
  COLS.forEach((c,i) => {
    try{ fitColumn(i); }
    catch(e){ trouble.push(c.label); logLine('Fit failed on "' + c.label + '": ' + e, 'err'); }
  });
  const moved = COLS.map((c,i) => ({label:c.label, from:before[i], to:widths[i]}))
                    .filter(x => x.from !== x.to);
  const detail = moved.map(x => x.label + ' ' + x.from + '\u2192' + x.to + 'px').join(', ');
  if(moved.length){
    logLine('Fit columns: ' + detail, 'ok');
    showFitBar('Fitted ' + moved.length + ' column' + (moved.length === 1 ? '' : 's') +
               ' \u2014 ' + detail + '.', 'done');
  } else if(trouble.length){
    showFitBar('Could not measure: ' + trouble.join(', ') + '.', 'done');
  } else {
    logLine('Fit columns: every column already fits its content.', 'ok');
    showFitBar('Every column already fits its content \u2014 nothing to change.', 'done');
  }
}
/* Reset restores everything: preferences (widths, log height, copy mode),
   the sort, and the opening state (List tab, log hidden, filters and toggles
   off). Python asks for confirmation first and rewrites the settings file. */
function resetAll(){
  if(!connected){ applyDefaults(); logLine('Reset to defaults (preview).', 'ok'); return; }
  send('resetSettings', {}).then(res => {
    if(!res || res.ok === false){ showErr((res && res.error) || 'Reset failed.'); return; }
    if(!res.reset) return;                      // answered No
    applyDefaults(res.settings);
  });
}
function applyDefaults(settings){
  const p = (settings && settings.prefs) || {};
  widths = COLS.map((c,i) => clampW(i, c.def));
  sortKey = null; sortDir = 1;
  logHeight = typeof p.logHeight === 'number' ? p.logHeight : 150;
  copyMode = p.copyMode === 'plain' ? 'plain' : 'color';
  autoCheck = true; paintAutoCheck();
  try{
    window.localStorage.removeItem('si.widths');
    window.localStorage.removeItem('si.log');
  }catch(e){}
  if(selectedOnly) $('btnSelOnly').click();
  if(subEntities) $('btnSub').click();
  if(revealSelected) $('btnReveal').click();
  $('filter').value = ''; paintFilterClear();
  $('typeFilter').value = '';
  setLogVisible(false);
  setTab('list');
  applyCopyMode(); applyLogHeight();
  paintSortIndicators(); applyWidths(); render();
  hideErr();
}

/* Preferences live in a settings file kept by Python outside the add-in
   folder, so a reinstall or a cleared webview cache keeps them. Browser
   storage is only the fallback for the standalone preview. */
function prefsPayload(){
  const w = {};
  COLS.forEach((c,i) => { if(widths[i] !== c.def) w[c.key] = Math.round(widths[i]); });
  return {prefs:{widths:w, logHeight:Math.round(logHeight), copyMode:copyMode}};
}
let settingsTimer = null;
function saveSettingsSoon(){
  if(!connected) return;
  clearTimeout(settingsTimer);
  settingsTimer = setTimeout(() => {
    send('saveSettings', prefsPayload()).then(res => {
      if(res && res.ok === false) showErr(res.error || 'Could not save settings.');
    });
  }, 400);
}
function applySettings(settings){
  const p = (settings && settings.prefs) || {};
  if(p.widths && typeof p.widths === 'object'){
    widths = COLS.map((c,i) => clampW(i, typeof p.widths[c.key] === 'number' ? p.widths[c.key] : c.def));
  }
  if(typeof p.logHeight === 'number') logHeight = p.logHeight;
  if(p.copyMode === 'color' || p.copyMode === 'plain') copyMode = p.copyMode;
  const o = (settings && settings.options) || {};
  if(typeof o.checkUpdates === 'boolean') autoCheck = o.checkUpdates;
  paintAutoCheck();
  applyCopyMode(); applyLogHeight(); applyWidths(); render();
}
/* Extra fields only the first 'ready' reply carries. */
let LINKS = {};
function applyReady(res){
  if(!res || res.ok === false) return;
  if(res.links) LINKS = res.links;
  if(res.settings){
    if(res.settingsFile){
      applySettings(res.settings);
    } else {
      // First run with a settings file: carry over what browser storage had.
      loadWidths(); loadPrefs(); applyCopyMode(); applyLogHeight(); applyWidths(); render();
      send('saveSettings', prefsPayload());
      logLine('Settings now saved to a file, so reinstalling keeps them.', 'sys');
    }
  }
  if(res.update) applyUpdate(res.update);
}

/* remember widths between sessions */
function saveWidths(){
  try{ window.localStorage.setItem('si.widths', JSON.stringify(widths)); }catch(e){}
  saveSettingsSoon();
}
/* Not restored, for the same reason the tab and the log are not: Reveal is
   part of the opening state, and the opening state is "everything off". */
function loadReveal(){
  $('btnReveal').classList.toggle('on', revealSelected);
}
function loadWidths(){
  try{
    const raw = window.localStorage.getItem('si.widths');
    if(raw){
      const w = JSON.parse(raw);
      if(Array.isArray(w) && w.length === COLS.length) widths = w.map((v,i) => clampW(i, +v || COLS[i].def));
    }
  }catch(e){}
}

/* ============================ visibility ============================ */
function setVisibility(ids, value){
  if(!ids.length) return;
  ids.forEach(id => { const r = rows.find(x => x.id === id); if(r) r.visible = value; });
  render();
  send('setVisibility', {ids:ids, visible:value, withParents:true}).then(res => {
    if(!res || res.ok === false){
      toast((res && res.error) || 'Could not change visibility.', false, true);
      refresh(); return;
    }
    if(res.failed && res.failed.length){
      res.failed.forEach(f => { const r = rows.find(x => x.id === f.id); if(r){ r.visible = !value; r.canToggle = false; } });
      render();
      const first = res.failed[0];
      toast(res.failed.length + ' item(s) could not be toggled — e.g. ' +
            (first.name || first.id) + ': ' + first.error, false, true);
      return;
    }
    if(res.parentsShown){
      // Parent occurrences were switched on too, so their rows are now stale.
      toast('Shown ' + res.changed + ' item(s), plus ' + res.parentsShown +
            ' parent(s) that were hidden.', true);
      refresh();
    } else {
      toast((value ? 'Shown ' : 'Hidden ') + res.changed + ' item(s).', true);
    }
  });
}

/* ============================ events ============================ */
/* Right-click a name to jump to that entity elsewhere in Fusion. */
let ctxRow = null;

function hideCtx(){ $('ctxmenu').style.display = 'none'; ctxRow = null; }

tbodyEl.addEventListener('contextmenu', e => {
  if(!e.target || typeof e.target.closest !== 'function'){ hideCtx(); return; }
  const cell = e.target.closest('td.c-name');
  const tr = cell && cell.closest('tr');
  if(!cell || !tr || tr.classList.contains('grp')) { hideCtx(); return; }
  e.preventDefault();
  ctxRow = +tr.dataset.id;
  const menu = $('ctxmenu');
  menu.style.display = 'block';
  // keep it on screen near the edges
  const w = menu.offsetWidth || 168, h2 = menu.offsetHeight || 90;
  menu.style.left = Math.min(e.clientX, window.innerWidth  - w - 6) + 'px';
  menu.style.top  = Math.min(e.clientY, window.innerHeight - h2 - 6) + 'px';
  uiLog('Right-click: "' + rowName(ctxRow) + '"');
});

$('ctxmenu').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if(!btn || ctxRow === null) return;
  const where = btn.dataset.where, id = ctxRow;
  hideCtx();
  send('showIn', {id:id, where:where}).then(res => {
    if(!res || res.ok === false) toast((res && res.error) || 'Could not run that command.', false, true);
  });
});

window.addEventListener('mousedown', e => {
  // window-level: the target is not always an Element, so closest() may be absent
  const t = e.target;
  if(!t || typeof t.closest !== 'function' || !t.closest('#ctxmenu')) hideCtx();
});
window.addEventListener('keydown', e => { if(e.key === 'Escape') hideCtx(); });
window.addEventListener('blur', hideCtx);

/* The only clickable row. Entity rows remain inert. */
tbodyEl.addEventListener('click', e => {
  if(e.target.type === 'checkbox') return;

  // Entity rows stay inert apart from their caret, so clicking a name or path
  // still does nothing - but the click is still worth recording.
  const caret = e.target.closest('.caret[data-parent]');
  if(caret){
    const id = +caret.dataset.parent;
    const opening = !expandedParents.has(id);
    uiLog('Caret: "' + rowName(id) + '" -> ' + (opening ? 'expand' : 'collapse'));
    if(opening) expandedParents.add(id); else expandedParents.delete(id);
    render();
    return;
  }

  const grp = e.target.closest('tr.grp');
  if(grp){
    const key = grp.dataset.key;
    const g = groupIndex[key];
    /* An impatient second click used to collapse the group just as its rows
       arrived - the load is slow, the row said nothing, so of course it got
       clicked again. While a load is in flight the row is inert. */
    if(loadingGroups.has(key)){
      uiLog('Group row: still loading — click ignored, it will open on its own');
      return;
    }
    const opening = !expanded.has(key);
    uiLog('Group row: "' + (g ? g.type + ' × ' + (g.count || g.items.length) : key) +
          '" -> ' + (opening ? 'expand' : 'collapse'));
    if(opening) expanded.add(key); else expanded.delete(key);
    // v2.36.3: report the state that survived the render, not the intent.
    // "collapse" was logged eleven times running while the group stayed open.
    setTimeout(() => {
      const now = expanded.has(key);
      if(now !== opening) uiLog('  ...but it is still ' + (now ? 'open' : 'closed'), 'warn');
    }, 0);
    // Opening a group is what asks Fusion for its rows. Collapsing keeps them:
    // they were paid for already, and reopening should be instant.
    // g.loaded, not the global set: a group whose rows already exist - because
    // they came with the scan, or were fetched earlier - has nothing to fetch
    if(opening && g && !g.loaded) loadGroup(key, g.parentId, g.type);
    else render();
    return;
  }

  /* Anywhere in the row, not just the name cell. "Click a row" meant the row -
     the first cut only listened on Entity Name, so a click on Type or Path did
     nothing at all and the feature looked dead. The controls are excluded
     because they have their own jobs. */
  if(e.target.closest('input, .caret, tr.grp')) return;
  const row = e.target.closest('tbody tr:not(.spacer)');
  const id = row && row.dataset.id !== undefined ? +row.dataset.id : null;
  if(id !== null){
    uiLog('Row: "' + rowName(id) + '" — asking Fusion to flash it');
    startFlash(id, row);
    return;
  }
  /* v2.36.5: every other interaction writes a line, so a click that reaches no
     branch used to leave the log looking as though the click never happened -
     and "the caret is dead" became impossible to tell from "I missed it". Name
     what was actually under the pointer. */
  const t = e.target;
  uiLog('Click hit <' + t.tagName.toLowerCase() +
        (t.className ? ' class="' + t.className + '"' : '') +
        '> which has no action — nothing done', 'warn');
});

/* ------------------------- flashing an entity -------------------------

   Click a row and its entity blinks in the viewport until the pointer leaves
   that row. Deliberately not implemented by selecting it: the table is a
   readout of what *you* have picked, and hijacking the selection to point at
   something would destroy the thing the table exists to show. Fusion draws an
   overlay instead - custom graphics, view-only - and this side owns the timer,
   because an add-in has no reliable one.

   Rows are still inert in every other way. This starts nothing that a mouse
   leaving the row does not stop. */
const FLASH_MS = 420;
let flashId = null, flashRow = null, flashTimer = null, flashOn = true;
/* Groups that hold something selected but have not been built. */
let lastHints = [];

function stopFlash(why){
  if(flashTimer){ clearInterval(flashTimer); flashTimer = null; }
  if(flashRow){ flashRow.classList.remove('flashing'); flashRow = null; }
  if(flashId === null) return;
  flashId = null;
  send('flashOff', {}).catch(() => {});
  if(why) uiLog('Flash stopped (' + why + ')');
}

function startFlash(id, row){
  if(flashId === id) return;            // already flashing this one
  stopFlash();
  flashId = id;
  flashRow = row;
  row.classList.add('flashing');
  send('flash', {id:id}).then(res => {
    if(flashId !== id) return;          // moved on while Fusion was thinking
    if(!res || res.flashing === false){
      row.classList.remove('flashing');
      const why = (res && res.why) || 'Nothing to flash for that row.';
      logLine('Flash: "' + rowName(id) + '" — ' + why, 'warn');
      toast(why, false, true);
      flashId = null; flashRow = null;
      return;
    }
    logLine('Flash: "' + rowName(id) + '" — drawn as ' + (res.how || 'graphics'), 'ok');
    flashOn = true;
    flashTimer = setInterval(() => {
      flashOn = !flashOn;
      send('flashPulse', {on:flashOn}).catch(() => stopFlash('bridge'));
    }, FLASH_MS);
  }).catch(() => stopFlash('failed'));
}

/* The pointer leaving the row is the stop signal, so it has to be caught on the
   way out of the row itself - mouseout bubbles, mouseleave on tbody would only
   fire when the pointer left the whole table. */
tbodyEl.addEventListener('mouseout', e => {
  if(!flashRow) return;
  const to = e.relatedTarget;
  if(to && flashRow.contains(to)) return;   // still inside the same row
  stopFlash('pointer left the row');
});

// and anything that rebuilds or hides the table takes the overlay with it
wrap.addEventListener('scroll', () => { if(flashId !== null) stopFlash('scrolled'); },
                      {passive:true});
window.addEventListener('blur', () => stopFlash());

tbodyEl.addEventListener('change', e => {
  const cb = e.target;
  if(cb.type !== 'checkbox') return;
  const id = +cb.dataset.id;

  if(cb.dataset.col === 'selgroup'){
    const g = groupIndex[cb.dataset.key];
    if(!g) return;
    uiLog('Checkbox: group "' + g.type + ' × ' + g.items.length + '" -> ' +
          (cb.checked ? 'select all' : 'deselect all'));
    const wanted = new Set(selected);
    g.items.forEach(r => { if(cb.checked) wanted.add(r.id); else wanted.delete(r.id); });
    setSelection([...wanted]);
    return;
  }

  if(cb.dataset.col === 'sel'){
    uiLog('Checkbox: Selected "' + rowName(id) + '" -> ' + (cb.checked ? 'select' : 'deselect'));
    // Send the whole desired set, so the palette and Fusion can't disagree.
    const wanted = new Set(selected);
    if(cb.checked) wanted.add(id); else wanted.delete(id);
    setSelection([...wanted], id, cb.checked);
    return;
  }

  uiLog('Checkbox: Show "' + rowName(id) + '" -> ' + (cb.checked ? 'show' : 'hide'));
  // Each Show checkbox drives its own row only - no action-at-a-distance from
  // the Fusion selection. For bulk work use "Selected only" + Show all/Hide all.
  setVisibility([id], cb.checked);
});

function setSelection(ids, changedId, wantChecked){
  send('setSelection', {ids:ids}).then(res => {
    if(!res || res.ok === false){
      toast((res && res.error) || 'Could not change the selection.', false, true);
      render();
      return;
    }
    applyData(res);
    if(res.refused && res.refused.length){
      toast(res.refused[0], false, true);
    } else if(wantChecked && changedId !== undefined && !selected.has(changedId)){
      // Fusion accepted the call but didn't take the entity - usually because
      // it's hidden, which makes it unselectable in the canvas.
      toast('Fusion would not select that entity. Hidden entities cannot be selected.');
    }
  });
}

/* Rows are deliberately inert. Clicking one does nothing: the Selection column
   and the row highlight are a readout of Fusion's selection, never a control
   for it. The only interactive element in a row is its Show checkbox. */

/* Shared by both segmented groups: the checked input's label gets .on. */
function paintRadios(groupId){
  [...$(groupId).querySelectorAll('label')].forEach(l => {
    l.classList.toggle('on', l.querySelector('input').checked);
  });
}

function applyCopyMode(){
  const input = $('copyMode').querySelector('input[value="' + copyMode + '"]');
  if(input) input.checked = true;
  paintRadios('copyMode');
}

$('copyMode').addEventListener('change', e => {

});

function paintVisMode(){

    l.classList.toggle('on', l.querySelector('input').checked);
  });
}
function selectVisMode(mode){
  const input = $('visMode').querySelector('input[value="' + mode + '"]');

}

/* Sets real visibility in the model, then applies the rescan that comes back so
   the Show column matches Fusion's browser rather than drifting from it. */
$('visMode').addEventListener('change', e => {
  if(!e.target.name) return;
  const mode = e.target.value;
  uiLog('Radio: visibility mode -> ' + mode);
  paintVisMode();
  send('visibilityMode', {mode:mode}).then(res => {
    if(!res || res.ok === false){
      toast((res && res.error) || 'Could not change visibility.', false, true);
      selectVisMode(visMode);          // put the radio back where it was
      return;
    }
    visMode = mode;
    applyData(res);
    selectVisMode(mode);               // applyData re-rendered; keep the radio lit
    let msg = res.changed ? res.changed + ' item(s) switched.' : 'Nothing needed changing.';
    if(res.failed && res.failed.length) msg += ' ' + res.failed.length + ' could not be changed.';
    toast(msg, true, true);
  });
});

/* Filtering and sorting can only see rows that exist, and sub-entity rows are
   built on expand. So there has to be a way to say "actually, all of them" -
   with the cost stated first, since on this model it is the 100 seconds that
   started all this. */
$('btnLoadAll').addEventListener('click', () => {
  const n = pendingSubCount();
  if(!n) return;
  uiLog('Load all sub-entities: ' + n.toLocaleString() + ' rows');
  toast('Building ' + n.toLocaleString() + ' sub-entity rows — this is the slow ' +
        'one, and it is why they load on expand.', false, true);
  $('btnLoadAll').disabled = true;
  send('loadAllSub', {}).then(res => {
    $('btnLoadAll').disabled = false;
    if(!res || res.ok === false){ toast('Could not load them all.'); return; }
    for(const r of (res.rows || [])) loadedGroups.add(r.parentId + '|' + (r.group || r.type));
    mergeRows(res.rows || []);
    if(Array.isArray(res.selected)) selected = new Set(res.selected);
    render();
    toast((res.rows || []).length.toLocaleString() + ' sub-entity rows loaded.', true, true);
  });
});

/* How many counted-but-not-built rows there are, which is what the button is
   offering to do and what it costs. */
function pendingSubCount(){
  let n = 0;
  for(const r of rows){
    if(!r.subGroups) continue;
    for(const dec of r.subGroups){
      if(!isLoaded(r.id + '|' + dec.type)) n += dec.count;
    }
  }
  return n;
}

let deb;

  clearTimeout(deb); deb = setTimeout(render, 130);
});
$('typeFilter').addEventListener('change', () => {

  if(e.key === 'F5' || ((e.ctrlKey||e.metaKey) && e.key.toLowerCase() === 'r')){ e.preventDefault(); refresh(); }
  if(e.key === 'Escape'){ clearFilter(); }

/* ============================ log pane ============================ */
const LOG_MAX = 500;          // keep memory bounded on a long session
let lastBanner = '';
let lastMarker = null;   // timeline marker position from the last payload
let logHeight = 150;
let logVisible = false;       // off by default; the toggle and prefs can turn it on
let legendVisible = false;    // mirrors the legend palette, owned by Fusion
let copyMode = 'color';       // 'color' keeps the level colors; 'plain' is text only

function showErr(message){
  const strip = $('errstrip');
  strip.querySelector('.msg').textContent = String(message);
  strip.style.display = 'block';
}
function hideErr(){ $('errstrip').style.display = 'none'; }
$('errstrip').addEventListener('click', hideErr);
window.addEventListener('error', e => {
  showErr('Palette script error: ' + (e.message || e) + (e.lineno ? ' (line ' + e.lineno + ')' : ''));
});

let UPD = {}, updDismissed = false, autoCheck = true, manualCheck = false;
function paintAutoCheck(){ $('btnAutoUpd').classList.toggle('on', autoCheck); }
$('btnAutoUpd').addEventListener('click', () => {
  autoCheck = !autoCheck; paintAutoCheck(); applyUpdate(UPD);
  uiLog('Toggle: automatic update check -> ' + (autoCheck ? 'on' : 'off'));
  if(connected) send('saveSettings', {options:{checkUpdates:autoCheck}});
});
function applyUpdate(info){
  UPD = info || {};
  const bar = $('updbar'), msg = bar.querySelector('.msg');
  const st = UPD.state;
  const show = !updDismissed && (autoCheck || manualCheck) && (st === 'newer' || st === 'installing' || st === 'installed' || st === 'installFailed');
  bar.style.display = show ? 'flex' : 'none';
  $('updInstall').disabled = (st === 'installing' || st === 'installed');
  $('updInstall').style.display = (st === 'installed') ? 'none' : '';
  if(st === 'newer'){
    msg.textContent = 'Version ' + UPD.latest + ' is available (you have ' + UPD.current + ').' +
                      (UPD.notes ? ' ' + UPD.notes : '');
  } else if(st === 'installing'){
    msg.textContent = 'Installing version ' + (UPD.latest || '') + '...';
  } else if(st === 'installed'){
    msg.textContent = 'Version ' + UPD.installed + ' is installed. Open Scripts and Add-Ins (Shift+S, or ' +
                      'UTILITIES > ADD-INS > Scripts and Add-Ins) and turn SelectionInspector\'s Run switch off, then on.';
  } else if(st === 'installFailed'){
    msg.textContent = 'The update could not be installed: ' + (UPD.error || '?') + ' Use Download instead.';
  }
  const btn = $('btnUpdCheck');
  btn.disabled = (st === 'checking' || st === 'installing');
  btn.textContent = st === 'checking' ? 'Checking...' : 'Check for updates';
}
function openUrl(url){
  if(!url) return;
  if(connected) send('openUrl', {url:url}).then(res => { if(res && res.ok === false) showErr(res.error); });
  else window.open(url, '_blank');
}
$('updInstall').addEventListener('click', () => send('installUpdate', {}));
$('updDl').addEventListener('click', () => openUrl(UPD.zip || LINKS.download));
$('updWhat').addEventListener('click', () => openUrl(LINKS.releases));
$('updX').addEventListener('click', () => { updDismissed = true; applyUpdate(UPD); });
$('btnUpdCheck').addEventListener('click', () => {
  if(!connected){ logLine('Not connected to Fusion - this is the standalone preview.', 'warn'); return; }
  updDismissed = false; manualCheck = true;
  send('checkUpdate', {});
});
$('btnDocs').addEventListener('click', () =>
  openUrl(LINKS.docs || 'https://swami-claude-skills.github.io/fusion-addin-selection-inspector/'));

function logLine(message, level){
  if(level === 'err') showErr(message);
  const body = $('logbody');
  const now = new Date();
  const stamp = [now.getHours(), now.getMinutes(), now.getSeconds()]
                  .map(n => String(n).padStart(2,'0')).join(':');
  const row = document.createElement('div');
  row.className = 'ln ' + (level || '');
  row.innerHTML = '<span class="t">' + stamp + '</span><span class="m">' + esc(message) + '</span>';

  // only stick to the bottom if the user is already there
  const atBottom = body.scrollHeight - body.scrollTop - body.clientHeight < 24;
  body.appendChild(row);
  while(body.childElementCount > LOG_MAX) body.removeChild(body.firstChild);
  if(atBottom) body.scrollTop = body.scrollHeight;
}

function setLogVisible(on){
  logVisible = !!on;
  $('logpane').style.display = logVisible ? 'flex' : 'none';
  $('loghandle').style.display = logVisible ? 'block' : 'none';
  $('btnLog').classList.toggle('on', logVisible);
  applyLogHeight();
  savePrefs();
}
function applyLogHeight(){
  logHeight = Math.max(60, Math.min(window.innerHeight - 160, Math.round(logHeight)));
  $('logpane').style.height = logHeight + 'px';
}

let logDrag = null;
$('loghandle').addEventListener('mousedown', e => {
  e.preventDefault();
  logDrag = {y:e.clientY, h:logHeight};
  document.body.classList.add('resizing-v');
  window.addEventListener('mousemove', onLogDrag);
  window.addEventListener('mouseup', endLogDrag);
});
function onLogDrag(e){
  if(!logDrag) return;
  logHeight = logDrag.h + (logDrag.y - e.clientY);   // drag up = taller
  applyLogHeight();
}
function endLogDrag(){
  logDrag = null;
  document.body.classList.remove('resizing-v');
  window.removeEventListener('mousemove', onLogDrag);
  window.removeEventListener('mouseup', endLogDrag);
  savePrefs();
}

/* Interaction trace. Logged in the capture phase so the click is recorded
   before whatever it triggers, giving a readable cause-then-effect ordering. */
function uiLog(message){ logLine(message, 'ui'); }

function buttonLabel(btn){
  return (btn.textContent || btn.id || 'button').replace(/\s+/g, ' ').trim();
}
document.addEventListener('click', e => {
  const t = e.target;
  if(!t || typeof t.closest !== 'function') return;
  const btn = t.closest('button');
  if(btn) uiLog('Click: ' + buttonLabel(btn) + (btn.disabled ? ' (disabled)' : ''));
}, true);

/* The legend lives in its own floating palette, opened and closed by Fusion;
   the button just mirrors whatever state comes back. */
function paintLegendButton(){
  $('btnLegend').classList.toggle('on', legendVisible);
}
$('btnLegend').addEventListener('click', () => {
  send('toggleLegend').then(res => {
    if(!res || res.ok === false){ toast((res && res.error) || 'Could not open the legend.'); return; }
    legendVisible = !!res.visible;
    paintLegendButton();
  });
});

/* One panel visible at a time. Every control keeps its id, so nothing else
   in here has to know the toolbar was split up. */
const TABS = ['list','vis','cols','tools'];
let activeTab = 'list';

function setTab(name){
  if(TABS.indexOf(name) === -1) name = 'list';
  activeTab = name;
  TABS.forEach(t => {
    const panel = $('tab-' + t);
    if(panel) panel.style.display = (t === name) ? 'flex' : 'none';
  });
  [...document.querySelectorAll('.tabbar .tab')].forEach(b =>
    b.classList.toggle('on', b.dataset.tab === name));
  savePrefs();
}

document.querySelector('.tabbar').addEventListener('click', e => {
  const tab = e.target.closest && e.target.closest('.tab');
  if(!tab) return;
  uiLog('Tab: ' + tab.textContent.trim());
  setTab(tab.dataset.tab);
});

$('btnLog').addEventListener('click', () => setLogVisible(!logVisible));
$('btnLogHide').addEventListener('click', () => setLogVisible(false));
$('btnLogSave').addEventListener('click', () => {
  const text = logText();
  if(!text){ toast('The log is empty - nothing to save.'); return; }
  send('saveLog', {html: logHTML(), text: text}).then(res => {
    if(!res || res.ok === false) toast((res && res.error) || 'Could not save the log.', false, true);
    else toast('Saved to ' + res.path, true, true);
  });
});

$('btnLogClear').addEventListener('click', () => { $('logbody').innerHTML = ''; logLine('Log cleared.', 'sys'); });
function logText(){
  return [...$('logbody').children]
    .map(r => r.querySelector('.t').textContent + '  ' + r.querySelector('.m').textContent)
    .join('\n');
}

/* Copy via a throwaway textarea.

   Fusion serves the palette from a file:// path, which is not a secure context,
   so navigator.clipboard is usually absent - and when it is present its
   writeText() rejects asynchronously, which a plain try/catch never sees. Both
   failure modes leave whatever was already on the clipboard, which is why Copy
   looked like it was pasting something else entirely. execCommand works here.

   The user's own selection is saved and restored, so copying the log doesn't
   wipe a selection they were in the middle of making. */
function copyToClipboard(text){
  let restore = null;
  try{
    const sel = document.getSelection();
    if(sel && sel.rangeCount) restore = sel.getRangeAt(0).cloneRange();

    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:absolute; left:-9999px; top:0; opacity:0;';
    document.body.appendChild(ta);
    ta.select();
    if(ta.setSelectionRange) ta.setSelectionRange(0, text.length);

    const ok = document.execCommand('copy');
    document.body.removeChild(ta);

    if(restore && sel){ sel.removeAllRanges(); sel.addRange(restore); }
    return !!ok;
  }catch(e){
    return false;
  }
}

/* Colors for the rich flavour. Deliberately not the on-screen neon: these are
   darkened so a line stays readable whether the wrapper's dark background
   survives the paste or the target strips it and leaves black-on-white. */
const COPY_COLORS = {'':'#6b7280', ui:'#9aa3ad', ok:'#00a05a',
                      warn:'#b8860b', err:'#d1435b', sys:'#00a8c6'};

const COPY_BG = '#000000';

/* The background has to sit on the runs that actually carry text, not just on
   a wrapper.

   Rich-text converters (TextEdit's HTML-to-RTF, Word, Mail) have no concept of
   a block's backdrop - they map background-color onto each character run as a
   highlight attribute. A wrapper-only background is therefore dropped, and the
   text inherits the document default, which is white. Declaring it on every
   div AND every span is what makes it survive. Long-hand background-color is
   used throughout: some converters ignore the `background` shorthand. */
function logHTML(){
  const lines = [...$('logbody').children].map(row => {
    const level = [...row.classList].find(c => c !== 'ln') || '';
    const color = COPY_COLORS[level] || COPY_COLORS[''];
    const stamp = row.querySelector('.t').textContent;
    const message = row.querySelector('.m').textContent;
    return '<div style="background-color:' + COPY_BG + ';color:' + color +
             ';white-space:pre-wrap;margin:0;">' +
           '<span style="background-color:' + COPY_BG + ';color:#8a8f98;">' +
             esc(stamp) + '</span>' +
           '<span style="background-color:' + COPY_BG + ';color:' + color + ';">' +
             '&nbsp;&nbsp;' + esc(message) + '</span>' +
           '</div>';
  }).join('');
  return '<div style="background-color:' + COPY_BG + ';color:' + COPY_COLORS[''] +
         ';padding:10px;font-family:Consolas,Menlo,monospace;font-size:12px;' +
         'line-height:1.55;">' + lines + '</div>';
}

/* Puts both flavours on the clipboard: text/html so colors survive a paste
   into anything rich, and text/plain for editors and terminals. The copy event
   fires from the execCommand below, and setData wins over the textarea's
   contents. If the event never fires, the plain text has still been copied. */
function copyRich(plain, html){
  let rich = false;
  function onCopy(e){
    try{
      const data = e.clipboardData || window.clipboardData;
      if(!data) return;
      data.setData('text/plain', plain);
      data.setData('text/html', html);
      e.preventDefault();
      rich = true;
    }catch(err){ /* fall through to the plain copy */ }
  }
  document.addEventListener('copy', onCopy, true);
  const plainOk = copyToClipboard(plain);
  document.removeEventListener('copy', onCopy, true);
  return {ok: rich || plainOk, rich: rich};
}

$('btnLogCopy').addEventListener('click', () => {
  const text = logText();
  if(!text){ toast('The log is empty - nothing to copy.'); return; }
  const lines = text.split('\n').length;

  if(copyMode === 'plain'){
    if(copyToClipboard(text)) toast(lines + ' log line(s) copied as plain text.', true);
    else toast('Could not write to the clipboard. The log is selectable - drag across it and press Ctrl/Cmd+C.');
    return;
  }

  const res = copyRich(text, logHTML());
  if(res.ok){
    toast(lines + ' log line(s) copied' +
          (res.rich ? ' with colors - paste into anything rich to keep them.'
                    : ' as plain text (this destination refused the colored version).'), true);
  }else{
    toast('Could not write to the clipboard. The log is selectable - drag across it and press Ctrl/Cmd+C.');
  }
});

/* Two kinds of state, and only one is a preference.

   How things look once you are using them - log height, copy mode, column
   widths - is worth carrying between sessions. Which tab is open, whether the
   log is showing, and which toggles are lit are the *opening* state, and that
   is asked to be the same every time: List, log hidden, nothing on. Storing
   those meant a session where you happened to end on the Tools tab with the
   log open reopened that way forever, which is what "start in list tab, log
   hidden" was asking to stop. */
function savePrefs(){
  try{
    window.localStorage.setItem('si.log', JSON.stringify({h:logHeight, copy:copyMode}));
  }catch(e){}
  saveSettingsSoon();
}
function loadPrefs(){
  try{
    const raw = window.localStorage.getItem('si.log');
    if(raw){
      const p = JSON.parse(raw);
      if(typeof p.h === 'number') logHeight = p.h;
      if(p.copy === 'color' || p.copy === 'plain') copyMode = p.copy;
      // p.on and p.tab are deliberately ignored - see savePrefs. Older stored
      // values may still contain them; reading them back is the bug.

    }
  }catch(e){}
}

let toastTimer;
/* silent=true for outcomes Python has already logged. Without it the same
   result lands in the pane twice - once from Python, once from the toast -
   which reads like the action happened twice. */
function toast(msg, good, silent){
  if(!silent) logLine(msg, good ? 'ok' : 'warn');
  const t = $('toast');
  t.textContent = msg;
  t.className = 'show' + (good ? ' good' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = ''; }, good ? 1800 : 5200);
}

/* ============================ boot ============================ */
/* Poll for the bridge instead of assuming it exists on parse. Fusion injects
   `adsk` at its own pace, and on a cold start that can be a second or two
   after the document script runs. */
function waitForBridge(tries, done){
  if(bridgeReady()){ setMode(true); done(); return; }
  if(tries <= 0){ setMode(false); done(); return; }
  setTimeout(() => waitForBridge(tries - 1, done), 100);
}

let booted = false;
function boot(){
  if(booted) return;
  booted = true;
  loadWidths();
  loadPrefs();
  setTab(activeTab);
  applyCopyMode();
  paintLegendButton();
  setLogVisible(logVisible);
  logLine('Palette loaded.', 'sys');
  loadReveal();
  paintAutoCheck();
  buildHeader();
  render('Connecting to Fusion…');

  // Keep polling for up to ~12s; the moment the bridge appears, load real data.
  waitForBridge(120, () => { if(connected) send('ready', {subEntities:subEntities, uiVersion:UI_VERSION}).then(res => { applyData(res); applyReady(res); }); });

  // If it hasn't shown up quickly we're almost certainly in a browser, so drop
  // to the standalone preview dataset. A late bridge still overrides this.
  setTimeout(() => {
    if(!connected && !rows.length){ setMode(false); send('ready', {subEntities:subEntities, uiVersion:UI_VERSION}).then(applyData); }
  }, 1500);
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', boot);
  window.addEventListener('load', boot);
} else {
  boot();
}

/* ---- standalone preview data, so this file can be opened in a browser ---- */
function demoReply(action, data){
  if(action === 'ready' || action === 'refresh'){
    const demo = [
      ['Root','Component',1,'root','Root component',true],
      ['Frame:1','Component',2,'root / Frame:1','Local · instance 1 of 2 · grounded',true],
      ['Frame:2','Component',2,'root / Frame:2','Local · instance 2 of 2',false],
      ['Bracket:1','Component',4,'root / Frame:1 / Bracket:1','Linked · instance 1 of 4',true],
      ['Body1','Body',2,'root / Frame:1 / Body1','2 occurrences',true],
      ['Rail','Body',4,'root / Frame:1 / Bracket:1 / Rail','4 occurrences',true],
      ['Base Profile','Sketch',2,'root / Frame:1 / Base Profile','2 occurrences',false],
      ['Mid Plane','Plane',1,'root / Mid Plane','Root component',false],
      ['Pivot','Joint',4,'root / Frame:1 / Bracket:1 / Pivot','4 occurrences',true],
      ['Datum Axis','Axis',1,'root / Datum Axis','Root component',false],
      ['Face 1','Face',2,'root / Frame:1 / Body1 / Face 1','2 occurrences',true],
      ['Edge 4','Edge',2,'root / Frame:1 / Body1 / Edge 4','2 occurrences',true],
      ['Vertex 2','Vertex',2,'root / Frame:1 / Body1 / Vertex 2','2 occurrences',true],
      ['Line 3','Sketch Line',2,'root / Frame:1 / Base Profile / Line 3','2 occurrences',true],
      ['Point 1','Sketch Point',2,'root / Frame:1 / Base Profile / Point 1','2 occurrences',true]
    ];
    // 3 picked directly, 4 matched through a picked face -> 3 raw entities, 2 rows
    return {ok:true, version:'2.37.0', document:'preview.f3d (standalone)',
      selected:[3,4,10], selCount:4, subEntities:true, subCount:5, truncated:false,
      sketchState:{inSketch:false, sketch:''},
      timeline:{available:true, position:12, count:34},
      rows: demo.map((d,i) => ({id:i, name:d[0], type:d[1], qty:d[2], path:d[3], status:d[4], visible:d[5], canToggle:true}))};
  }
  if(action === 'showIn'){
    return {ok:false, error:'Not connected to Fusion — this is the standalone preview.'};
  }
  if(action === 'toggleLegend'){
    return {ok:false, error:'Not connected to Fusion — this is the standalone preview.'};
  }
  if(action === 'saveLog'){
    return {ok:false, error:'Not connected to Fusion — this is the standalone preview.'};
  }
  if(action === 'setSelection'){
    return {ok:false, error:'Not connected to Fusion — this is the standalone preview.'};
  }
  if(action === 'visibilityMode'){
    return {ok:false, error:'Not connected to Fusion — this is the standalone preview.'};
  }
  if(action === 'textCommand'){
    return {ok:false, error:'Not connected to Fusion — this is the standalone preview.'};
  }
  return {ok:true, changed:(data && data.ids ? data.ids.length : 0), failed:[], parentsShown:0};
}
